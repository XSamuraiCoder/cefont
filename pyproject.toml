[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "cefont"
version = "1.0.0"
description = "Turn TTF/OTF fonts into FontLibC fonts for the TI-84 Plus CE"
readme = "README.md"
requires-python = ">=3.9"
dependencies = ["pillow>=9.2"]
authors = [{ name = "Akhilesh Gollapudi" }]
license = "MIT"
keywords = ["ti-84", "fontlibc", "ce-toolchain", "fonts"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]

[project.optional-dependencies]
fonttools = ["fonttools"]
dev = ["pytest"]

[project.scripts]
cefont = "cefont.cli:main"

[project.urls]
Homepage = "https://github.com/akhilgollapudi/cefont"

[tool.setuptools.packages.find]
where = ["src"]