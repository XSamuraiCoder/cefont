[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project.urls]
Homepage = "https://github.com/coolprojects123/cefont"   # adjust to your real repo URL

[project]
# these are all optional but make the PyPI page look right:
authors = [{ name = "Akhilesh Gollapudi" }]
license = "MIT"            # or whatever license you actually use
keywords = ["ti-84", "fontlibc", "ce-toolchain", "fonts"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.13",
    "Operating System :: OS Independent",
]

[project.optional-dependencies]
fonttools = ["fonttools"]
dev = ["pytest"]

[project.scripts]
cefont = "cefont.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
